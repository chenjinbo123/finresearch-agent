[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "finresearch-agent-service"
version = "0.1.0"
description = "The first FastAPI learning slice for FinResearch Agent"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "httpx>=0.27.0",
    "pypdf>=6.15.0",
    "python-multipart>=0.0.32",
    "uvicorn[standard]>=0.30.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
]

[project.scripts]
finresearch-eval = "app.evals:main"
finresearch-rebuild-embeddings = "app.embeddings:main"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools.packages.find]
include = ["app*"]
